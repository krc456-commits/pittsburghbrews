name: Index event flyers
on:
  push:
    branches: [main, feature/find-your-brew-retailers]
    paths:
      - 'public/brand/events/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/index-event-images.cjs
      - name: Commit refreshed event image index
        run: |
          if ! git diff --quiet -- src/data/eventImageFiles.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/eventImageFiles.json
            git commit -m "Refresh uploaded event artwork index"
            git push
          fi
